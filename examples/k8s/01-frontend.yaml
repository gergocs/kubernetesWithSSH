apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: demo-app
  labels:
    app: frontend
    app.kubernetes.io/part-of: kubernetes-ssh-demo
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <title>Kubernetes with SSH Demo</title>
      <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: #1e1e2e; color: #cdd6f4; text-align: center; padding: 40px; }
        h1 { color: #89b4fa; }
        .card { background: #313244; border-radius: 8px; padding: 20px; max-width: 600px; margin: 20px auto; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .badge { background: #a6e3a1; color: #11111b; padding: 4px 10px; border-radius: 12px; font-weight: bold; }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>Kubernetes With SSH Plugin Demo</h1>
        <p><span class="badge">Running</span></p>
        <p>This frontend deployment verifies Nginx container inspection, logs, scale operations, rollout restarts, and terminal execution.</p>
      </div>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: demo-app
  labels:
    app: frontend
    tier: presentation
    app.kubernetes.io/part-of: kubernetes-ssh-demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: presentation
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 150m
              memory: 128Mi
          volumeMounts:
            - name: html-volume
              mountPath: /usr/share/nginx/html
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: html-volume
          configMap:
            name: frontend-config
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: demo-app
  labels:
    app: frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: frontend
