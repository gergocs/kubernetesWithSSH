apiVersion: v1
kind: Pod
metadata:
  name: multi-container-demo
  namespace: demo-app
  labels:
    app: multi-container
    app.kubernetes.io/part-of: kubernetes-ssh-demo
spec:
  containers:
    - name: web-app
      image: alpine:3.20
      command:
        - /bin/sh
        - -c
        - |
          echo "Starting web-app container...";
          while true; do
            date -u +"%Y-%m-%dT%H:%M:%SZ [web-app] Handling active HTTP traffic..." >> /shared-logs/app.log;
            sleep 3;
          done
      volumeMounts:
        - name: shared-logs-volume
          mountPath: /shared-logs
    - name: log-agent
      image: alpine:3.20
      command:
        - /bin/sh
        - -c
        - |
          echo "Starting log-agent sidecar...";
          touch /shared-logs/app.log;
          tail -f /shared-logs/app.log;
      volumeMounts:
        - name: shared-logs-volume
          mountPath: /shared-logs
  volumes:
    - name: shared-logs-volume
      emptyDir: {}
